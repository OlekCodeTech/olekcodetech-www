# Każdy push na main (także zapis w panelu /admin/) uruchamia:
#  1) podgląd na GitHub Pages: https://olekcodetech.github.io/olekcodetech-www/ (noindex, prefiks ścieżki)
#  2) wdrożenie produkcyjne na Hostinger przez SSH – gdy w repozytorium jest zmienna DEPLOY_HOSTINGER=true
#     (Settings → Secrets and variables → Actions; sekrety SSH_*). Instrukcja w README, sekcja „Wdrożenie produkcyjne”.
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Karty Open Graph dla nowych stron
        run: npx tsx scripts/gen-og.mts
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /olekcodetech-www
          NEXT_PUBLIC_SITE_URL: https://olekcodetech.github.io/olekcodetech-www
          NEXT_PUBLIC_NOINDEX: "1"
          NEXT_PUBLIC_GTAG_ID: ""
          NEXT_PUBLIC_FORM_ENDPOINT: ""
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  production:
    if: vars.DEPLOY_HOSTINGER == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Karty Open Graph dla nowych stron
        run: npx tsx scripts/gen-og.mts
      - name: Build produkcyjny (olekcodetech.pl)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://olekcodetech.pl
          NEXT_PUBLIC_FORM_ENDPOINT: /api/contact.php
      - name: Kontrola SEO (title, description, canonical, martwe linki)
        run: python3 scripts/seo-audit.py out
      - name: Wysyłka na Hostinger (SSH, klucz ograniczony do rozpakowania w public_html)
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Serwer ma wymuszoną komendę dla tego klucza: tar xzf - -C .../olekcodetech.pl/public_html
          tar czf - -C out . | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"
          echo "Wdrożono $(find out -type f | wc -l) plików"
      - name: Kontrola po wdrożeniu (z pominięciem CDN)
        run: |
          for u in / /oferta/ /aplikacje-dedykowane/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://olekcodetech.pl$u?v=$GITHUB_RUN_ID")
            echo "$code $u"; [ "$code" = "200" ] || exit 1
          done
